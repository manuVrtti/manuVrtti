name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: manuVrtti
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=22D3EE&color_dots=2d3343,7C3AED,A78BFA,22D3EE,10B981
            dist/snake-light.svg?palette=github-light&color_snake=0891B2&color_dots=ebedf0,A78BFA,7C3AED,0891B2,10B981

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
